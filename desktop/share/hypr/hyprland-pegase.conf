# Pégase Desktop — special workspace (style Yakuake)
# Installé par scripts/install-hyprland-pegase.sh

windowrulev2 = workspace special:pegase silent, class:^(pegase-desktop)$
windowrulev2 = float, center, size 520 740, class:^(pegase-desktop)$
windowrulev2 = noinitialfocus, class:^(pegase-desktop)$

bind = $mainMod, P, exec, pegase-hypr-toggle
